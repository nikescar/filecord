[package]
name = "filecord"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.11", features = ["json", "multipart", "rustls-tls"], default-features = false }
tokio = { version = "1.0", features = ["full"] }
notify = "6.1"
anyhow = "1.0"
dirs = "5.0"
