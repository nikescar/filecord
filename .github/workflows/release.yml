on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  RUST_VERSION: 1.86.0
  BIN_NAME: "filecord"

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os || 'ubuntu-22.04' }}
    strategy:
      matrix:
        platform:
          # Linux targets
          - name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            build-args: "--release"

          - name: Linux aarch64
            target: aarch64-unknown-linux-gnu
            build-args: "--release"

    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
          components: rustfmt, clippy

      - name: Install cross-compilation tools for ARM64
        if: contains(matrix.platform.target, 'aarch64')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build ${{ matrix.platform.name }} binary
        run: |
          cargo build ${{ matrix.platform.build-args }} --target ${{ matrix.platform.target }}
      
      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: filecord-${{ matrix.platform.target }}
          path: target/${{ matrix.platform.target }}/release/filecord
          retention-days: 1
      
  release:
    name: Release
    needs: [ build ]
    if: startsWith( github.ref, 'refs/tags/v' )
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4.1.7
        with:
          path: artifacts

      - name: Prepare release artifacts
        run: |
          find artifacts/
          mkdir -p distbin/

          for i in ./artifacts/* 
          do
              if [ -d "$i" ]
              then
                  cp LICENSE* "$i" 2>/dev/null || true
                  cp README.md "$i" 2>/dev/null || true
                  cp filecord.conf.example "$i" 2>/dev/null || true
                  chmod +x "$i/filecord" 2>/dev/null || true
                  tar -cvpzf "${i}.tar.gz" --directory=${i} .
              fi
          done
          cp artifacts/*.tar.gz distbin/
        
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          make_latest: true
          files: distbin/*
          token: ${{ secrets.GITHUB_TOKEN }}
